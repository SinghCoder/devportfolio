<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Moved</title>
  <meta name="robots" content="noindex, follow">
  <script>
    var dest = 'https://singhcoder.github.io' +
      location.pathname.replace(/^\/devportfolio\//, '') +
      location.search + location.hash;
    location.replace(dest);
  </script>
</head>

<body>
  <p>Page moved. <a id="link" href="https://singhcoder.github.io/">Go to new site</a></p>
  <script>document.getElementById('link').href = dest;</script>
</body>

</html>
